name: Deploy Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: ${{ vars.TF_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Inspect OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(printf '%s' "$RESPONSE" | python3 -c \
            'import json, sys; print(json.load(sys.stdin)["value"])')
          OIDC_TOKEN="$TOKEN" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {
              key: claims.get(key)
              for key in ("iss", "aud", "sub", "repository", "ref", "environment")
          }
          print(json.dumps(visible, indent=2))
          PY

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform format
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Test website
        run: |
          URL=$(terraform output -raw cloudfront_url)
          curl --fail --retry 10 --retry-delay 15 "$URL"
